name: CI - Docker y GHCR

# Se ejecuta en cada push a main (y también a mano desde la pestaña Actions)
on:
  push:
    branches: [main]
    # Además, al subir un tag de versión (v1, v2, v1.0.0...) se publica con ese nombre
    tags: ['v*']
  workflow_dispatch:

# GITHUB_TOKEN solo tiene lectura sobre packages por defecto:
# hace falta "packages: write" para poder publicar en GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v6

      - name: Definir nombre de imagen y SHA corto
        run: |
          # GHCR exige nombres en minúsculas
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Imagen a publicar: $IMAGE:$SHORT_SHA"
          # Si el push fue de un tag (ej. v1), se usa como versión
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "Versión: $GITHUB_REF_NAME"
          fi

      - name: Construir la imagen Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$SHORT_SHA" .

      - name: Verificar que la aplicación responde
        run: |
          docker run -d --name app-test -p 8080:80 "$IMAGE:$SHORT_SHA"
          # Esperar a que nginx levante (hasta 10 intentos)
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8080 > respuesta.html; then
              break
            fi
            sleep 1
          done
          cat respuesta.html
          grep -q "Hola DevOps" respuesta.html
          echo "OK: la página contiene 'Hola DevOps'"

      - name: Detener el contenedor de prueba
        if: always()
        run: docker rm -f app-test || true

      - name: Iniciar sesión en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar la imagen en GHCR
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          echo "Publicada: \`$IMAGE:$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$VERSION" ]]; then
            docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
            echo "Publicada: \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          fi